name: Bug Report
description: Submit a bug report.
title: "[Bug]: "
labels: Bug
body:
  - type: markdown
    attributes:
      value: |
        Issues are public. Do not include credentials, private screen content, raw process lists, or unrelated logs.
        Review any support bundle or screenshot before attaching it. For vulnerabilities, read our [security policy](https://github.com/Mabry-Ventures/mv-barline/blob/main/SECURITY.md) instead.
  - type: checkboxes
    attributes:
      label: Search for Similar Reports
      description: |
        Please search this repository's Issues page, including closed issues, before filing a report.

        **Important**: Only submit a new issue if the bug you encountered hasn't been reported in an existing open issue, or if a regression has occurred with a previously closed issue.
      options:
        - label: I have searched existing issues for similar reports
          required: true
  - type: textarea
    attributes:
      label: Description
      placeholder: A clear and concise description of the bug...
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to Reproduce
      description: Steps to reliably reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: App Version and Build
      placeholder: e.g. 1.0.13 (build 38), from About
    validations:
      required: true
  - type: input
    id: macos_version
    attributes:
      label: macOS Version
      placeholder: e.g. macOS 26.6.2 (include the OS build if available)
    validations:
      required: true
  - type: input
    id: installation_source
    attributes:
      label: Installation or Update Source
      placeholder: Official release, local source build, or upgrade from a previous version
    validations:
      required: true
  - type: textarea
    id: display_configuration
    attributes:
      label: Menu Bar and Display Setup
      description: Include display count, built-in notch if present, system menu bar auto-hide, and whether the issue occurs in full screen. Do not include display serial numbers.
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: Expected and Actual Behavior
      description: What should happen, what happened instead, and whether this worked in an earlier Barline version.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Additional Information
      description: Optional. Use Advanced → Diagnostics to create and review a support bundle; it is not automatically sent. Redact private information from every attachment.
      placeholder: Reviewed support bundle, redacted screenshot, or other relevant details
